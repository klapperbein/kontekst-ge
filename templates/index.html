<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>კონტექსტი 🇬🇪 - Multiplayer</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .flag-icon {
            font-size: 1.8rem;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .game-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-color);
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 20px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .guess-history {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .guess-card {
            background: #0f172a;
            padding: 14px 18px;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            min-height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">
            <span class="flag-icon">🇬🇪</span>
            <h1>კონტექსტი</h1>
        </div>
        <p class="subtitle">მულტიპლეიერი - იპოვეთ საიდუმლო სიტყვა ერთად</p>

        <!-- ოთახის და PIN კოდის პანელი -->
        <div id="room-setup" class="input-group">
            <input type="text" id="room-input" placeholder="შეიყვანეთ ოთახის PIN კოდი...">
            <button id="join-room-btn">ოთახში შესვლა / შექმნა</button>
        </div>

        <!-- თამაშის ძირითადი პანელი (თავიდან დამალულია, სანამ ოთახში არ შეხვალთ) -->
        <div id="game-panel" class="hidden">
            <div id="status-bar" class="game-status-bar">ოთახი: <span id="current-room-name">არ არის</span></div>
            
            <div class="input-group">
                <input type="text" id="guess-input" placeholder="შეიყვანეთ სიტყვა...">
                <button id="guess-btn">გამოცნობა</button>
            </div>

            <div id="history" class="guess-history"></div>
        </div>
    </div>

    <script>
        const socket = io();

        const roomSetup = document.getElementById('room-setup');
        const gamePanel = document.getElementById('game-panel');
        const roomInput = document.getElementById('room-input');
        const joinRoomBtn = document.getElementById('join-room-btn');
        const currentRoomName = document.getElementById('current-room-name');
        
        const guessInput = document.getElementById('guess-input');
        const guessBtn = document.getElementById('guess-btn');
        const historyDiv = document.getElementById('history');

        let currentRoom = '';

        // ოთახში შესვლა / PIN კოდის გაგზავნა
        joinRoomBtn.addEventListener('click', () => {
            const roomCode = roomInput.value.trim();
            if (roomCode) {
                currentRoom = roomCode;
                socket.emit('join_room', { room: roomCode });
                
                currentRoomName.textContent = roomCode;
                roomSetup.classList.add('hidden');
                gamePanel.classList.remove('hidden');
            } else {
                alert('გთხოვთ შეიყვანოთ ოთახის PIN კოდი!');
            }
        });

        roomInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                joinRoomBtn.click();
            }
        });

        // სიტყვის გამოცნობის გაგზავნა სერვერზე
        if (guessBtn && guessInput) {
            guessBtn.addEventListener('click', () => {
                const word = guessInput.value.trim();
                if (word && currentRoom) {
                    socket.emit('make_guess', { room: currentRoom, word: word });
                    guessInput.value = '';
                }
            });

            guessInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    guessBtn.click();
                }
            });
        }

        // სერვერიდან შედეგების მიღება და ეკრანზე გამოტანა
        socket.on('guess_result', function(data) {
            if (!data) return;

            const card = document.createElement('div');
            card.className = 'guess-card';
            
            const wordSpan = document.createElement('span');
            wordSpan.textContent = data.word || '';
            wordSpan.style.zIndex = '2';

            const scoreSpan = document.createElement('span');
            scoreSpan.textContent = data.score !== undefined ? `სიახლოვე: ${data.score}` : '';
            scoreSpan.style.zIndex = '2';
            scoreSpan.style.color = 'var(--accent-color)';

            card.appendChild(wordSpan);
            card.appendChild(scoreSpan);
            
            // ისტორიის თავში დამატება
            historyDiv.prepend(card);
        });
    </script>
</body>
</html>
