<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>კონტექსტი 🇬🇪 - Multiplayer</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
            --top-highlight: #f59e0b; /* ოქროსფერი აქცენტი ლიდერი/მაღალი ქულის სიტყვებისთვის */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .flag-icon {
            font-size: 1.8rem;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .secondary-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            margin-top: 8px;
        }

        .secondary-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .game-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-color);
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 20px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .guess-history {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .guess-card {
            background: #0f172a;
            padding: 14px 18px;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            min-height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 🌟 ყველაზე მაღალი პროცენტის მქონე ბარათის გამოკვეთა ოქროსფერი ფერით */
        .guess-card.top-guess {
            border-color: var(--top-highlight);
            background: rgba(245, 158, 11, 0.1);
        }

        .guess-card.top-guess .score-text {
            color: var(--top-highlight) !important;
            font-weight: 900;
            font-size: 1.1rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">
            <span class="flag-icon">🇬🇪</span>
            <h1>კონტექსტი</h1>
        </div>
        <p class="subtitle">მულტიპლეიერი - იპოვეთ საიდუმლო სიტყვა ერთად</p>

        <div id="room-setup" class="input-group">
            <input type="text" id="username-input" placeholder="თქვენი სახელი...">
            <button id="create-room-btn">ახალი ოთახის შექმნა</button>
            <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin: 4px 0;">ან</div>
            <input type="text" id="room-input" placeholder="შეიყვანეთ ოთახის PIN კოდი...">
            <button id="join-room-btn" class="secondary-btn">ოთახში შესვლა კოდით</button>
        </div>

        <div id="game-panel" class="hidden">
            <div id="status-bar" class="game-status-bar">
                <span>ოთახი PIN: <span id="current-room-name" style="color:white;">-</span></span>
            </div>
            
            <div class="input-group">
                <input type="text" id="guess-input" placeholder="შეიყვანეთ სიტყვა...">
                <button id="guess-btn">გამოცნობა</button>
            </div>

            <div id="history" class="guess-history"></div>
        </div>
    </div>

    <script>
        const socket = io();

        const roomSetup = document.getElementById('room-setup');
        const gamePanel = document.getElementById('game-panel');
        const usernameInput = document.getElementById('username-input');
        const roomInput = document.getElementById('room-input');
        const createRoomBtn = document.getElementById('create-room-btn');
        const joinRoomBtn = document.getElementById('join-room-btn');
        const currentRoomName = document.getElementById('current-room-name');
        
        const guessInput = document.getElementById('guess-input');
        const guessBtn = document.getElementById('guess-btn');
        const historyDiv = document.getElementById('history');

        let currentRoom = '';
        let currentUsername = 'მოთამაშე';

        createRoomBtn.addEventListener('click', () => {
            currentUsername = usernameInput.value.trim() || 'მოთამაშე 1';
            socket.emit('create_room', { username: currentUsername });
        });

        socket.on('room_created', (data) => {
            currentRoom = data.room_id;
            currentRoomName.textContent = currentRoom;
            roomSetup.classList.add('hidden');
            gamePanel.classList.remove('hidden');
        });

        joinRoomBtn.addEventListener('click', () => {
            const roomCode = roomInput.value.trim();
            currentUsername = usernameInput.value.trim() || 'მოთამაშე 2';
            
            if (roomCode) {
                currentRoom = roomCode;
                socket.emit('join_room', { room_id: currentRoom, username: currentUsername });
            } else {
                alert('გთხოვთ შეიყვანოთ ოთახის PIN კოდი!');
            }
        });

        socket.on('player_joined', (data) => {
            currentRoom = data.room_id;
            currentRoomName.textContent = currentRoom;
            roomSetup.classList.add('hidden');
            gamePanel.classList.remove('hidden');

            if (data.history) {
                updateHistoryUI(data.history);
            }
        });

        socket.on('error_message', (data) => {
            alert(data.error);
        });

        if (guessBtn && guessInput) {
            guessBtn.addEventListener('click', () => {
                const word = guessInput.value.trim();
                if (word && currentRoom) {
                    socket.emit('make_guess', { 
                        room_id: currentRoom, 
                        username: currentUsername, 
                        word: word 
                    });
                    guessInput.value = '';
                }
            });

            guessInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    guessBtn.click();
                }
            });
        }

        // სერვერიდან შემოსული განახლებული და დალაგებული ისტორია
        socket.on('room_update', function(data) {
            if (!data) return;
            updateHistoryUI(data.history);

            if (data.is_over) {
                if (data.is_correct) {
                    alert(`🎉 გილოცავთ! სიტყვა გამოიცნო (${data.latest_player}): ${data.target_word}`);
                } else {
                    alert(`მცდელობები ამოიწურა. საიდუმლო სიტყვა იყო: ${data.target_word}`);
                }
            }
        });

        function updateHistoryUI(historyList) {
            historyDiv.innerHTML = '';
            
            historyList.forEach((item, index) => {
                const card = document.createElement('div');
                // პირველი (ყველაზე მაღალი პროცენტის) ბარათი მიიღებს top-guess კლასს და ოქროსფერ ფერს
                card.className = `guess-card ${index === 0 ? 'top-guess' : ''}`;
                
                const wordSpan = document.createElement('span');
                let badge = index === 0 ? ' 🔥' : '';
                wordSpan.innerHTML = `<b>${item.word}</b>${badge} <span style="font-size:0.8rem; color:var(--text-muted);">(${item.player})</span>`;
                wordSpan.style.zIndex = '2';

                const scoreSpan = document.createElement('span');
                scoreSpan.className = 'score-text';
                scoreSpan.textContent = `სიახლოვე: ${item.score}`;
                scoreSpan.style.zIndex = '2';
                scoreSpan.style.color = 'var(--accent-color)';

                card.appendChild(wordSpan);
                card.appendChild(scoreSpan);
                
                historyDiv.appendChild(card);
            });
        }
    </script>
</body>
</html>
