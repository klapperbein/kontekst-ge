<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>კონტექსტი 🇬🇪 - Multiplayer</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .flag-icon {
            font-size: 1.8rem;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .game-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-color);
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 20px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .guess-history {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .guess-card {
            background: #0f172a;
            padding: 14px 18px;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            min-height: 54px;
            display: flex;
            align-items: center;
        }

        .guess-progress {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            opacity: 0.25;
            transition: width 0.5s ease;
            z-index: 1;
        }

        .guess-info {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            line-height: 1.2;
        }

        .word-text {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
        }

        .player-name {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .score-text {
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* --- ADVERTISEMENT CONTAINER --- */
        .ad-container {
            margin-top: 24px;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
        }

        .ad-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .ad-placeholder {
            width: 100%;
            padding: 15px;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 8px;
            color: #818cf8;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Modal styling for Game Over */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            z-index: 10;
        }

        .modal-title {
            font-size: 1.8rem;
            margin-bottom: 12px;
        }

        .modal-word {
            font-size: 1.4rem;
            color: #38bdf8;
            margin: 10px 0 20px 0;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">
            <h1>კონტექსტი</h1>
            <span class="flag-icon">🇬🇪</span>
        </div>
        <p class="subtitle">მულტიპლეიერ სიტყვების თამაში</p>

        <div id="lobby-section">
            <div class="input-group">
                <input type="text" id="username" placeholder="შეიყვანეთ ნიკნეიმი...">
                <button onclick="createRoom()">ახალი ოთახის შექმნა</button>
            </div>
            
            <div style="text-align: center; color: var(--text-muted); margin: 12px 0;">ან</div>

            <div class="input-group">
                <input type="text" id="room-code-input" placeholder="ოთახის 4-ნიშნა კოდი">
                <button style="background: #334155;" onclick="joinRoom()">ოთახში შესვლა</button>
            </div>
        </div>

        <div id="game-section" class="hidden">
            <div class="game-status-bar">
                <span id="display-room-code">კოდი: ----</span>
                <span id="display-guess-count">სვლები: 0 / 30</span>
            </div>

            <div class="input-group" style="flex-direction: row;">
                <input type="text" id="guess-input" placeholder="ჩაწერეთ სიტყვა..." onkeypress="handleKeyPress(event)">
                <button style="width: 100px;" onclick="sendGuess()">გაგზავნა</button>
            </div>

            <div class="guess-history" id="guess-list">
                </div>
        </div>

        <div class="ad-container">
            <div class="ad-label">რეკლამა / Advertisement</div>
            <div class="ad-placeholder" id="ad-slot">
                <span>📢 სარეკლამო ბანერი</span>
            </div>
        </div>

        <div id="game-modal" class="modal-overlay hidden">
            <h2 id="modal-heading" class="modal-title">Game Over</h2>
            <p id="modal-desc">საიდუმლო სიტყვა იყო:</p>
            <div id="modal-target-word" class="modal-word">---</div>
            <button onclick="restartGame()">ახალი თამაშის დაწყება 🔄</button>
        </div>
    </div>

    <script>
       const socket = io({
    transports: ['websocket', 'polling'],
    secure: true,
    rejectUnauthorized: false
});
        let currentRoom = "";
        let username = "";
        let allGuesses = []; // ინახავს ყველა სიტყვას სორტირებისთვის

        function createRoom() {
            username = document.getElementById('username').value.trim() || 'მოთამაშე 1';
            socket.emit('create_room', { username: username });
        }

        function joinRoom() {
            username = document.getElementById('username').value.trim() || 'მოთამაშე 2';
            const code = document.getElementById('room-code-input').value.trim();
            if(!code) return alert("შეიყვანეთ ოთახის კოდი!");

            socket.emit('join_room', { username: username, room_id: code });
        }

        function sendGuess() {
            const input = document.getElementById('guess-input');
            const word = input.value.trim();
            if(!word) return;

            // მყისიერად ვასუფთავებთ და ვფოკუსირებთ ინპუთს
            input.value = "";
            input.focus();

            socket.emit('make_guess', { room_id: currentRoom, username: username, word: word });
        }

        function restartGame() {
            socket.emit('restart_game', { room_id: currentRoom });
        }

        function handleKeyPress(e) {
            if(e.key === 'Enter') sendGuess();
        }

        // Socket Events
        socket.on('room_created', (data) => {
            currentRoom = data.room_id;
            setupGameView(data.guesses_count, data.max_guesses);
        });

        socket.on('player_joined', (data) => {
            currentRoom = data.room_id;
            setupGameView(data.guesses_count, data.max_guesses);
            
            allGuesses = [];
            if(data.history) {
                data.history.forEach(item => {
                    addGuessToUI(item.player, item.word, item.score);
                });
            }

            if(data.is_over) {
                showModal("თამაში დასრულებულია", "ეს ოთახი უკვე დასრულდა.");
            }
        });

        socket.on('error_message', (data) => {
            alert(data.error);
        });

        socket.on('guess_result', (data) => {
            if(data.error) alert(data.error);
        });

        socket.on('opponent_guessed', (data) => {
            addGuessToUI(data.player, data.word, data.score);
            updateGuessCount(data.guesses_count, data.max_guesses);

            if (data.is_correct) {
                showModal("🎉 გამარჯვება!", `${data.player}-მა გამოიცნო სიტყვა!`, data.word);
            } else if (data.is_over) {
                showModal("❌ Game Over", "30-ვე სვლა ამოიწურა. საიდუმლო სიტყვა იყო:", data.target_word);
            }
        });

        socket.on('game_restarted', (data) => {
            allGuesses = [];
            document.getElementById('guess-list').innerHTML = "";
            document.getElementById('game-modal').classList.add('hidden');
            updateGuessCount(0, data.max_guesses);
        });

        function setupGameView(count, max) {
            document.getElementById
